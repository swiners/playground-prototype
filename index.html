<link rel="stylesheet" href="fonts/inter.css" />

<script>
(function () {
  var forced = new URLSearchParams(window.location.search).get('theme');
  var stored = null;
  try {
    stored = localStorage.getItem('sd-theme');
  } catch (e) {}
  var choice = forced || stored || 'light';
  if (choice !== 'light' && choice !== 'dark' && choice !== 'system') choice = 'light';
  var system = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  document.documentElement.dataset.sdTheme = choice === 'system' ? system : choice;
})();
</script>

<style>
  
  :root {
    --sd-colour-blue-50:   #EEF4FF;
    --sd-colour-blue-100:  #DCE7FB;
    --sd-colour-blue-200:  #BACFF7;
    --sd-colour-blue-300:  #8FAFEF;
    --sd-colour-blue-400:  #6690E5;
    --sd-colour-blue-500:  #3B6FD4;
    --sd-colour-blue-600:  #2D59B0;
    --sd-colour-blue-700:  #24488F;
    --sd-colour-blue-800:  #1B3770;
    --sd-colour-blue-900:  #16294F;

    --sd-colour-surface-blue: var(--sd-colour-blue-50);
    --sd-colour-text-on-blue: var(--sd-colour-blue-700);
  }
  [data-sd-theme="dark"] {
    
    --sd-colour-surface-blue: var(--sd-colour-blue-900);
    --sd-colour-text-on-blue: var(--sd-colour-blue-300);
  }
  
  .ds-pill--blue.ds-pill--minimal {
    background: var(--sd-colour-surface-blue);
    color: var(--sd-colour-text-on-blue);
  }

  html, body { margin: 0; height: 100%; font-family: var(--sd-font-family); }
  body {
    background: var(--sd-colour-surface-default); color: var(--sd-colour-text-primary);
    overflow: hidden; overscroll-behavior: none;
    -webkit-font-smoothing: antialiased;
  }

  
  #app { height: 100%; }
  .pg-bleed { height: 100%; }
  .pg-bleed > .device-screen {
    position: static; inset: auto; height: 100%; border-radius: 0;
    background: var(--sd-colour-surface-default); overflow: hidden;
  }

  
  
  .pg-framed { height: 100%; display: flex; align-items: center; justify-content: center; }
  
  #scaler-box { margin: auto; }
  #scaler { transform-origin: top left; width: max-content; }

  .device { width: 390px; height: 800px; border-radius: 46px; padding: 0; flex-shrink: 0; background: #000;
    box-shadow: 0 30px 70px rgba(37,37,37,0.22), 0 0 0 11px #0a0a0a, 0 0 0 12px #2a2a2a; overflow: hidden; position: relative; }
  .device-screen { position: absolute; inset: 6px; border-radius: 40px; overflow: hidden; background: var(--sd-colour-surface-default); }
  .screen-fill { height: 100%; }
  
  .device.is-ipad { width: 834px; height: 1194px; border-radius: 44px; box-shadow: 0 30px 80px rgba(37,37,37,0.22), 0 0 0 12px #0a0a0a, 0 0 0 13px #2a2a2a; }
  .device.is-ipad.is-landscape { width: 1194px; height: 834px; }
  .device.is-ipad .device-screen { inset: 14px; border-radius: 30px; }

  
  body.is-bare { background: transparent; }
  body.is-bare .pg-framed { display: block; overflow: hidden; }

  
  .pg-shell { height: 100%; display: flex; flex-direction: column; overflow: hidden;
    background: var(--sd-colour-surface-grey); }
  
  .pg-shell__stage { flex: 1 1 0; min-height: 0; min-width: 0; display: flex; }
  .pg-shell__stage > .pg-framed { flex: 1; min-width: 0; }

  
  .pg-bar { flex: none; box-sizing: border-box; height: 48px; padding: 0 12px; position: relative;
    z-index: var(--sd-z-sticky); display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
    align-items: center; column-gap: 12px; font-family: var(--sd-font-family);
    background: var(--sd-colour-surface-default); border-bottom: 1px solid var(--sd-colour-border-subtle); }
  .pg-bar__left, .pg-bar__mid, .pg-bar__right { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .pg-bar__right { justify-content: flex-end; }
  .pg-bar__brand { display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; white-space: nowrap;
    color: var(--sd-colour-text-primary); font-size: var(--sd-font-size-sm); font-weight: var(--sd-font-weight-semibold); }
  .pg-bar__ver { flex-shrink: 0; font-variant-numeric: tabular-nums; }
  
  .pg-bar__pick { width: 256px; justify-content: space-between; gap: 8px; min-width: 0; }
  .pg-bar__pick > * { min-width: 0; }
  .pg-bar__name { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; }
  
  .pg-bar__num { flex-shrink: 0; font-variant-numeric: tabular-nums; font-weight: var(--sd-font-weight-semibold); }
  
  .pg-bar__hint { display: inline-flex; align-items: baseline; gap: 6px; flex-shrink: 0; padding: 4px 10px;
    border-radius: var(--sd-radius-full); background: var(--sd-colour-surface-cyan); color: var(--sd-colour-text-on-cyan);
    font-size: var(--sd-font-size-xs); font-weight: var(--sd-font-weight-medium); white-space: nowrap; }
  .pg-bar__hint b { font-weight: var(--sd-font-weight-semibold); font-variant-numeric: tabular-nums; letter-spacing: 0.08em; }
  .pg-pills { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 8px; }
  .pg-bar .pg-pills { flex-wrap: nowrap; gap: 8px; }
  
  @media (max-width: 1179px) {
    .pg-bar__lbl, .pg-bar__wm { display: none; }
    .pg-bar__pick { width: 216px; }
  }
  @media (max-width: 959px) {
    .pg-bar { grid-template-columns: auto minmax(0, 1fr) auto; }
    .pg-bar__mid { justify-self: center; }
    .pg-bar__pick { width: clamp(150px, calc(100vw - 560px), 216px); }
    .pg-bar__hintlbl { display: none; }
  }
  @media (max-width: 759px) {
    .pg-bar { height: auto; padding: 8px 12px; grid-template-columns: minmax(0, 1fr) auto; row-gap: 8px; }
    .pg-bar__left, .pg-bar__right { flex-wrap: wrap; row-gap: 8px; }
    .pg-bar__mid { grid-column: 1 / -1; grid-row: 2; justify-self: stretch; justify-content: center; }
    .pg-bar__pick { width: min(256px, 52vw); }
  }
  
  @media (max-width: 859px) {
    .pg-bar--hint { height: auto; padding: 8px 12px; grid-template-columns: minmax(0, 1fr) auto; row-gap: 8px; }
    .pg-bar--hint .pg-bar__left, .pg-bar--hint .pg-bar__right { flex-wrap: wrap; row-gap: 8px; }
    .pg-bar--hint .pg-bar__mid { grid-column: 1 / -1; grid-row: 2; justify-self: stretch; justify-content: center; }
    .pg-bar--hint .pg-bar__pick { width: min(256px, 52vw); }
  }
  @media (max-width: 520px) { .pg-bar__brand { display: none; } }

  
  .pg-pop { max-height: calc(100vh - 72px); padding: 0; box-shadow: var(--sd-shadow-overlay); }
  .pg-pop__cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 0.92fr); align-items: stretch; }
  .pg-pop__list { min-width: 0; padding: 4px 0 6px; }
  .pg-pop .ds-menu__item { min-height: 0; padding: 6px 14px; font-size: var(--sd-font-size-sm); line-height: 20px; }
  .pg-pop__n { flex: 0 0 18px; font-variant-numeric: tabular-nums; color: var(--sd-colour-text-secondary); }
  .pg-pop__t { flex: 1 1 auto; min-width: 0; }
  .pg-kbd { flex-shrink: 0; margin-left: auto; padding-left: 8px; font-size: 11px; font-variant-numeric: tabular-nums;
    color: var(--sd-colour-text-secondary); white-space: nowrap; }
  
  .pg-pop .is-selected .pg-pop__n, .pg-pop .is-selected .pg-kbd,
  .pg-pop .is-active .pg-pop__n, .pg-pop .is-active .pg-kbd { color: inherit; }
  
  @media (max-height: 699px) { .pg-pop .ds-menu__item { padding-top: 4px; padding-bottom: 4px; } }
  .pg-pop__asks { box-sizing: border-box; padding: 12px 16px 16px; border-left: 1px solid var(--sd-colour-border-subtle);
    background: var(--sd-colour-surface-grey); }
  
  .pg-pop__asks-in { position: sticky; top: 12px; }
  @media (max-width: 639px) { .pg-pop__cols { grid-template-columns: minmax(0, 1fr); } .pg-pop__asks { display: none; } }

  .pg-label { margin: 0 0 8px; font-size: 10.5px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--sd-colour-text-secondary); }
  .pg-lede { margin: 0 0 6px; font-size: var(--sd-font-size-sm); font-weight: var(--sd-font-weight-semibold); }
  .pg-text { margin: 0; font-size: 12.5px; line-height: 1.5; color: var(--sd-colour-text-primary); }
  .pg-quiet { margin: 6px 0 0; font-size: 11.5px; line-height: 1.5; color: var(--sd-colour-text-secondary); }

  
  .pg-note { position: fixed; z-index: var(--sd-z-popover); box-sizing: border-box; width: min(380px, calc(100vw - 16px));
    max-height: calc(100vh - 72px); overflow-y: auto; padding: 14px 16px 16px; font-family: var(--sd-font-family);
    color: var(--sd-colour-text-primary); background: var(--sd-colour-surface-overlay);
    border: 1px solid var(--sd-colour-border-default); border-radius: var(--sd-radius-m); box-shadow: var(--sd-shadow-overlay); }

  
  .pg-more { position: fixed; z-index: var(--sd-z-popover); right: 12px; box-sizing: border-box;
    width: min(420px, calc(100vw - 24px)); overflow-y: auto; overscroll-behavior: contain; padding: 16px 16px 20px;
    font-family: var(--sd-font-family); color: var(--sd-colour-text-primary); background: var(--sd-colour-surface-overlay);
    border: 1px solid var(--sd-colour-border-default); border-radius: var(--sd-radius-lg); box-shadow: var(--sd-shadow-overlay);
    animation: pg-pop-in .16s ease both; }
  .pg-more:focus { outline: none; }
  .pg-more__head { display: flex; align-items: center; gap: 8px; margin: 0 0 16px; }
  .pg-more__title { margin: 0; font-size: var(--sd-font-size-base); font-weight: var(--sd-font-weight-semibold); }
  .pg-more__section { margin: 0 0 20px; }
  .pg-more__section:last-child { margin-bottom: 0; }
  .pg-more__row { display: flex; flex-direction: column; gap: 8px; margin: 0 0 14px; }
  .pg-more__row:last-child { margin-bottom: 0; }
  .pg-sub { margin: 0; font-size: var(--sd-font-size-sm); font-weight: var(--sd-font-weight-medium); }
  .pg-more dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 12.5px; }
  .pg-more dt { color: var(--sd-colour-text-secondary); }
  .pg-more dd { margin: 0; font-weight: var(--sd-font-weight-semibold); }
  .pg-more code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; }
  .pg-more .ds-accordion__body { padding-top: 2px; }
  .pg-more ul { margin: 0; padding-left: 16px; display: flex; flex-direction: column; gap: 6px; }
  .pg-more li { font-size: 12px; line-height: 1.5; color: var(--sd-colour-text-secondary); }
  .pg-note-card + .pg-note-card { margin-top: 14px; }
  .pg-keys { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; }
  .pg-flags { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; }
  @keyframes pg-pop-in { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }

  
  .pg-sr { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden;
    clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; border: 0; }

  
  .pg-handle { position: fixed; top: 50%; right: 0; transform: translateY(-50%); z-index: var(--sd-z-dropdown);
    box-sizing: border-box; width: 24px; height: 88px; padding: 0; border: 0; border-radius: 12px 0 0 12px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    background: var(--sd-colour-surface-inverse); color: var(--sd-colour-text-inverse);
    font-family: var(--sd-font-family); font-size: 11px; font-weight: 600; letter-spacing: 0.06em; }
  .pg-handle__t { writing-mode: vertical-rl; }
  
  .pg-handle::before { content: ''; position: absolute; top: 0; bottom: 0; left: -20px; right: 0; }
  .pg-handle:focus-visible { outline: 2px solid var(--sd-colour-border-focus); outline-offset: 2px; }
  
  .pg-wifi:focus-visible > span { outline: 2px solid var(--sd-colour-border-focus); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { .pg-more { animation: none; } }


  
  input[type="time"]::-webkit-calendar-picker-indicator { display: none; }
  
  input[type="month"]::-webkit-calendar-picker-indicator { display: none; }


  
  .device-screen *, .device-screen { scrollbar-width: none; }
  .device-screen ::-webkit-scrollbar { width: 0; height: 0; }
  .vc-scrollbar { position: absolute; right: 3px; width: 5px; border-radius: 999px;
    background: rgba(130,130,130,0.45); opacity: 0; pointer-events: none; transition: opacity .35s ease; z-index: 60; }
  .vc-scrollbar.is-visible { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { .vc-scrollbar { transition: none; } }

  
  #boot { position: fixed; inset: 0; z-index: 90; display: flex; align-items: center; justify-content: center;
    
    background: linear-gradient(180deg, var(--sd-colour-cyan-700), var(--sd-colour-cyan-1000)); transition: opacity .35s ease; }
  #boot.is-gone { opacity: 0; pointer-events: none; }
  #boot span { width: 66px; height: 66px; border-radius: 50%; background: #fff;
    color: var(--sd-colour-action-primary); display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 30px; }
  body.is-bare #boot { display: none; }

  
  @keyframes fp-rise { from { transform: translateY(14px); } to { transform: translateY(0); } }
  .screen-rise { animation: fp-rise .4s cubic-bezier(.22,.61,.36,1) both; }
  .fp-btn, .v-btn { transition: filter .15s, transform .1s; }
  .fp-btn:hover, .v-btn:hover { filter: brightness(1.06); }
  .fp-btn:active, .v-btn:active { transform: scale(.985); }
  .fp-row, .v-row { transition: transform .12s, box-shadow .18s; }
  .fp-row:hover, .v-row:hover { box-shadow: 0 4px 14px rgba(0,0,0,0.08); }
  .fp-row:active, .v-row:active { transform: scale(.985); }
  
  .rd-quiet { transition: background-color .12s, transform .1s !important; }
  .rd-quiet:hover { background-color: var(--sd-colour-surface-grey) !important; }
  .rd-quiet:active { background-color: var(--sd-colour-surface-grey) !important; transform: scale(.99) !important; }
  
  .fp-input:focus, .v-input:focus { outline: none; border-color: var(--sd-colour-action-primary) !important; box-shadow: 0 0 0 3px rgba(0,119,107,0.14); }
  
  .rd-sheet .fp-input:focus-visible { outline: 2px solid var(--sd-colour-action-primary) !important; outline-offset: 2px !important; }
  .rd-sheet .fp-input::placeholder { color: var(--sd-colour-text-secondary); opacity: 1; }
  .fp-input--dark::placeholder, .v-input--dark::placeholder { color: rgba(255,255,255,0.6); }
  .fp-input--dark:focus, .v-input--dark:focus { border-color: #fff !important; box-shadow: 0 0 0 3px rgba(255,255,255,0.18); }
  .v-key { transition: transform .08s, background .12s; }
  .v-key:active { transform: scale(.93); background: var(--sd-colour-grey-300) !important; }
  @keyframes v-shake-x { 10%,90%{transform:translateX(-2px);} 20%,80%{transform:translateX(4px);} 30%,50%,70%{transform:translateX(-7px);} 40%,60%{transform:translateX(7px);} }
  .v-shake { animation: v-shake-x .45s; }
  @keyframes v-shimmer { 0% { background-position: -260px 0; } 100% { background-position: 260px 0; } }
  .v-skeleton { background: linear-gradient(90deg, var(--sd-colour-surface-grey) 25%, var(--sd-colour-surface-default) 37%, var(--sd-colour-surface-grey) 63%);
    background-size: 520px 100%; animation: v-shimmer 1.4s ease infinite; }
  @keyframes v-rise-in { from { transform: translateY(14px); } to { transform: translateY(0); } }
  .v-rise { animation: v-rise-in .4s cubic-bezier(.22,.61,.36,1) both; }

  
  .v4-stack { position: relative; width: 100%; height: 100%;
    background: linear-gradient(165deg, var(--sd-colour-cyan-700), var(--sd-colour-cyan-900)); }
  .v4-layer { position: absolute; inset: 0; z-index: 1; }
  .v4-layer.is-out { opacity: 0; pointer-events: none; transition: opacity .2s cubic-bezier(.4,0,1,1); }
  .v4-layer.is-in { z-index: 2; animation: v4-enter .44s cubic-bezier(0,0,.2,1) .12s backwards; }
  @keyframes v4-enter { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  .v4-layer.is-in.v4-sheetup { animation: v4-sheetup-in .6s cubic-bezier(.16,.84,.28,1) backwards; }
  @keyframes v4-sheetup-in { from { transform: translateY(100%); } to { transform: none; } }
  .v4-layer.is-out.v4-formout { animation: v4-formout .38s cubic-bezier(.55,0,1,1) both; }
  @keyframes v4-formout { from { opacity: 1; transform: none; } to { opacity: 0; transform: translateY(-50px); } }
  .ipad-stack { position: relative; width: 100%; height: 100%; overflow: hidden;
    background: linear-gradient(165deg, var(--sd-colour-cyan-700), var(--sd-colour-cyan-900)); }
  .ipad-layer { position: absolute; inset: 0; }
  .ipad-layer.is-in { z-index: 2; }
  .ipad-layer.is-in.ipad-sheetup { animation: v4-sheetup-in .64s cubic-bezier(.16,.84,.28,1) backwards; }
  .ipad-layer.is-out { z-index: 1; }
  .ipad-layer.is-out.ipad-formout { animation: v4-formout .42s cubic-bezier(.55,0,1,1) both; }
  .v4-mark { position: absolute; top: 0; left: 0; z-index: 30; pointer-events: none;
    transition: transform .56s cubic-bezier(.45,.05,.15,1) .04s, width .56s cubic-bezier(.45,.05,.15,1) .04s, height .56s cubic-bezier(.45,.05,.15,1) .04s; }
  .v4-mark--snap { transition: none; }
  .v4-mark__face { position: absolute; inset: 0; transition: opacity .3s ease .16s; }
  .v4-flying .v4-inlinemark { visibility: hidden; }

  .v-splash, .fp-splash { transition: opacity .4s ease; }
  @keyframes v-splash-pop { from { opacity: 0; scale: .9; } to { opacity: 1; scale: 1; } }
  .v-splash-logo { animation: v-splash-pop .55s cubic-bezier(.22,.61,.36,1) both; }

  
  @keyframes vf-a { 0%,100%{ translate: 0 0; } 50%{ translate: 8px -11px; } }
  @keyframes vf-b { 0%,100%{ translate: 0 0; } 50%{ translate: -9px -6px; } }
  @keyframes vf-c { 0%,100%{ translate: 0 0; } 33%{ translate: 6px 8px; } 66%{ translate: -6px -5px; } }
  @keyframes vf-glide { 0%{ translate: 0 0; } 50%{ translate: 28px 11px; } 100%{ translate: 0 0; } }
  @keyframes vf-twinkle { 0%,100%{ opacity: var(--o,.4); } 50%{ opacity: calc(var(--o,.4) * .35); } }
  @keyframes vf-spin { from{ rotate: 0deg; } to{ rotate: 360deg; } }
  @keyframes vf-sway { 0%,100%{ rotate: -5deg; } 50%{ rotate: 5deg; } }
  @keyframes vf-bob  { 0%,100%{ translate: 0 0; } 50%{ translate: 0 -15px; } }
  @keyframes v-float { 0%,100%{ transform: translateY(0); } 50%{ transform: translateY(-8px); } }
  @keyframes rd-vf-a { 0%,100%{ translate: 0 0; } 50%{ translate: 8px -11px; } }
  @keyframes rd-vf-b { 0%,100%{ translate: 0 0; } 50%{ translate: -9px -6px; } }
  @keyframes rd-vf-c { 0%,100%{ translate: 0 0; } 33%{ translate: 6px 8px; } 66%{ translate: -6px -5px; } }
  @keyframes rd-vf-glide { 0%{ translate: 0 0; } 50%{ translate: 28px 11px; } 100%{ translate: 0 0; } }
  @keyframes rd-vf-bob { 0%,100%{ translate: 0 0; } 50%{ translate: 0 -13px; } }
  @keyframes rd-vf-sway { 0%,100%{ rotate: -5deg; } 50%{ rotate: 5deg; } }
  @keyframes rd-vf-twinkle { 0%,100%{ opacity: var(--o,.2); } 50%{ opacity: calc(var(--o,.2) * .4); } }

  @keyframes v-stagger-in { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  .v-stagger > * { animation: v-stagger-in .44s cubic-bezier(.28,1.1,.64,1) both; }
  .v-stagger > *:nth-child(1){animation-delay:.16s} .v-stagger > *:nth-child(2){animation-delay:.20s}
  .v-stagger > *:nth-child(3){animation-delay:.24s} .v-stagger > *:nth-child(4){animation-delay:.28s}

  history.replaceState = function () {
    try {
      return rs.apply(null, arguments);
    } catch (e) {}
  };
  if (!navigator.clipboard) {
    navigator.clipboard = {
      writeText: function (t) {
        try {
          var a = document.createElement('textarea');
          a.value = t;
          a.style.position = 'fixed';
          a.style.opacity = '0';
          document.body.appendChild(a);
          a.select();
          document.execCommand('copy');
          a.remove();
          return Promise.resolve();
        } catch (e) {
          return Promise.reject(e);
        }
      }
    };
  }
})();
