<script>
(function () {
  var forced = new URLSearchParams(window.location.search).get('theme');
  var stored = null;
  try {
    stored = localStorage.getItem('sd-theme');
  } catch (e) {}
  var choice = forced || stored || 'light';
  var system = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  document.documentElement.dataset.sdTheme = choice === 'system' ? system : choice;
})();
</script>

<style>
  
  :root {
    --sd-colour-blue-50:   #EEF4FF;
    --sd-colour-blue-100:  #DCE7FB;
    --sd-colour-blue-200:  #BACFF7;
    --sd-colour-blue-300:  #8FAFEF;
    --sd-colour-blue-400:  #6690E5;
    --sd-colour-blue-500:  #3B6FD4;
    --sd-colour-blue-600:  #2D59B0;
    --sd-colour-blue-700:  #24488F;
    --sd-colour-blue-800:  #1B3770;
    --sd-colour-blue-900:  #16294F;

    --sd-colour-surface-blue: var(--sd-colour-blue-50);
    --sd-colour-text-on-blue: var(--sd-colour-blue-700);
  }
  [data-sd-theme="dark"] {
    
    --sd-colour-surface-blue: var(--sd-colour-blue-900);
    --sd-colour-text-on-blue: var(--sd-colour-blue-300);
  }
  
  .ds-pill--blue.ds-pill--minimal {
    background: var(--sd-colour-surface-blue);
    color: var(--sd-colour-text-on-blue);
  }

  html, body { margin: 0; height: 100%; font-family: var(--sd-font-family); }
  body {
    background: var(--sd-colour-surface-default); color: var(--sd-colour-text-primary);
    overflow: hidden; overscroll-behavior: none;
    -webkit-font-smoothing: antialiased;
  }

  
  #app { height: 100%; }
  .pg-bleed { height: 100%; }
  .pg-bleed > .device-screen {
    position: static; inset: auto; height: 100%; border-radius: 0;
    background: var(--sd-colour-surface-default); overflow: hidden;
  }

  
  .pg-framed { height: 100%; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  
  #scaler-box { margin: auto; }
  #scaler { transform-origin: top left; width: max-content; }

  .device { width: 390px; height: 800px; border-radius: 46px; padding: 0; flex-shrink: 0; background: #000;
    box-shadow: 0 30px 70px rgba(37,37,37,0.22), 0 0 0 11px #0a0a0a, 0 0 0 12px #2a2a2a; overflow: hidden; position: relative; }
  .device-screen { position: absolute; inset: 6px; border-radius: 40px; overflow: hidden; background: var(--sd-colour-surface-default); }
  .screen-fill { height: 100%; }
  
  .device.is-ipad { width: 834px; height: 1194px; border-radius: 44px; box-shadow: 0 30px 80px rgba(37,37,37,0.22), 0 0 0 12px #0a0a0a, 0 0 0 13px #2a2a2a; }
  .device.is-ipad.is-landscape { width: 1194px; height: 834px; }
  .device.is-ipad .device-screen { inset: 14px; border-radius: 30px; }

  
  body.is-bare { background: transparent; }
  body.is-bare .pg-framed { display: block; }

  
  .pg-shell { height: 100%; overflow-y: auto; background: var(--sd-colour-surface-grey);
    display: flex; flex-direction: column; padding: 22px 22px 26px; box-sizing: border-box; gap: 16px; }
  .pg-shell__head { text-align: center; flex-shrink: 0; }
  .pg-shell__body { display: flex; gap: 20px; align-items: stretch; justify-content: center; }
  
  .pg-shell__side { width: 296px; flex-shrink: 0; display: flex; flex-direction: column; gap: 12px; }
  
  .pg-shell__side--scroll { max-height: min(78vh, 920px); overflow-y: auto; padding-right: 4px; }
  
  .pg-shell__stage { flex: 1; min-width: 0; height: min(78vh, 920px); display: flex; }
  .pg-shell__stage > .pg-framed, .pg-shell__stage > .pg-bleed { flex: 1; min-width: 0; }
  
  @media (max-width: 1320px) {
    .pg-shell__body { flex-wrap: wrap; }
    .pg-shell__side { width: 100%; order: 3; }
    .pg-shell__side--scroll { max-height: none; overflow-y: visible; }
    .pg-shell__stage { order: 1; flex-basis: 100%; height: 70vh; }
  }

  
  input[type="time"]::-webkit-calendar-picker-indicator { display: none; }


  
  .device-screen *, .device-screen { scrollbar-width: none; }
  .device-screen ::-webkit-scrollbar { width: 0; height: 0; }
  .vc-scrollbar { position: absolute; right: 3px; width: 5px; border-radius: 999px;
    background: rgba(130,130,130,0.45); opacity: 0; pointer-events: none; transition: opacity .35s ease; z-index: 60; }
  .vc-scrollbar.is-visible { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { .vc-scrollbar { transition: none; } }

  
  #boot { position: fixed; inset: 0; z-index: 90; display: flex; align-items: center; justify-content: center;
    
    background: linear-gradient(180deg, var(--sd-colour-cyan-700), var(--sd-colour-cyan-1000)); transition: opacity .35s ease; }
  #boot.is-gone { opacity: 0; pointer-events: none; }
  #boot span { width: 66px; height: 66px; border-radius: 50%; background: #fff;
    color: var(--sd-colour-action-primary); display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 30px; }
  body.is-bare #boot { display: none; }

  
  @keyframes fp-rise { from { transform: translateY(14px); } to { transform: translateY(0); } }
  .screen-rise { animation: fp-rise .4s cubic-bezier(.22,.61,.36,1) both; }
  .fp-btn, .v-btn { transition: filter .15s, transform .1s; }
  .fp-btn:hover, .v-btn:hover { filter: brightness(1.06); }
  .fp-btn:active, .v-btn:active { transform: scale(.985); }
  .fp-row, .v-row { transition: transform .12s, box-shadow .18s; }
  .fp-row:hover, .v-row:hover { box-shadow: 0 4px 14px rgba(0,0,0,0.08); }
  .fp-row:active, .v-row:active { transform: scale(.985); }
  
  .fp-input:focus, .v-input:focus { outline: none; border-color: var(--sd-colour-action-primary) !important; box-shadow: 0 0 0 3px rgba(0,119,107,0.14); }
  .fp-input--dark::placeholder, .v-input--dark::placeholder { color: rgba(255,255,255,0.6); }
  .fp-input--dark:focus, .v-input--dark:focus { border-color: #fff !important; box-shadow: 0 0 0 3px rgba(255,255,255,0.18); }
  .v-key { transition: transform .08s, background .12s; }
  .v-key:active { transform: scale(.93); background: var(--sd-colour-grey-300) !important; }
  @keyframes v-shake-x { 10%,90%{transform:translateX(-2px);} 20%,80%{transform:translateX(4px);} 30%,50%,70%{transform:translateX(-7px);} 40%,60%{transform:translateX(7px);} }
  .v-shake { animation: v-shake-x .45s; }
  @keyframes v-shimmer { 0% { background-position: -260px 0; } 100% { background-position: 260px 0; } }
  .v-skeleton { background: linear-gradient(90deg, var(--sd-colour-surface-grey) 25%, var(--sd-colour-surface-default) 37%, var(--sd-colour-surface-grey) 63%);
    background-size: 520px 100%; animation: v-shimmer 1.4s ease infinite; }
  @keyframes v-rise-in { from { transform: translateY(14px); } to { transform: translateY(0); } }
  .v-rise { animation: v-rise-in .4s cubic-bezier(.22,.61,.36,1) both; }

  
  .v4-stack { position: relative; width: 100%; height: 100%;
    background: linear-gradient(165deg, var(--sd-colour-cyan-700), var(--sd-colour-cyan-900)); }
  .v4-layer { position: absolute; inset: 0; z-index: 1; }
  .v4-layer.is-out { opacity: 0; pointer-events: none; transition: opacity .2s cubic-bezier(.4,0,1,1); }
  .v4-layer.is-in { z-index: 2; animation: v4-enter .44s cubic-bezier(0,0,.2,1) .12s backwards; }
  @keyframes v4-enter { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  .v4-layer.is-in.v4-sheetup { animation: v4-sheetup-in .6s cubic-bezier(.16,.84,.28,1) backwards; }
  @keyframes v4-sheetup-in { from { transform: translateY(100%); } to { transform: none; } }
  .v4-layer.is-out.v4-formout { animation: v4-formout .38s cubic-bezier(.55,0,1,1) both; }
  @keyframes v4-formout { from { opacity: 1; transform: none; } to { opacity: 0; transform: translateY(-50px); } }
  .ipad-stack { position: relative; width: 100%; height: 100%; overflow: hidden;
    background: linear-gradient(165deg, var(--sd-colour-cyan-700), var(--sd-colour-cyan-900)); }
  .ipad-layer { position: absolute; inset: 0; }
  .ipad-layer.is-in { z-index: 2; }
  .ipad-layer.is-in.ipad-sheetup { animation: v4-sheetup-in .64s cubic-bezier(.16,.84,.28,1) backwards; }
  .ipad-layer.is-out { z-index: 1; }
  .ipad-layer.is-out.ipad-formout { animation: v4-formout .42s cubic-bezier(.55,0,1,1) both; }
  .v4-mark { position: absolute; top: 0; left: 0; z-index: 30; pointer-events: none;
    transition: transform .56s cubic-bezier(.45,.05,.15,1) .04s, width .56s cubic-bezier(.45,.05,.15,1) .04s, height .56s cubic-bezier(.45,.05,.15,1) .04s; }
  .v4-mark--snap { transition: none; }
  .v4-mark__face { position: absolute; inset: 0; transition: opacity .3s ease .16s; }
  .v4-flying .v4-inlinemark { visibility: hidden; }

  .v-splash, .fp-splash { transition: opacity .4s ease; }
  @keyframes v-splash-pop { from { opacity: 0; scale: .9; } to { opacity: 1; scale: 1; } }
  .v-splash-logo { animation: v-splash-pop .55s cubic-bezier(.22,.61,.36,1) both; }

  
  @keyframes vf-a { 0%,100%{ translate: 0 0; } 50%{ translate: 8px -11px; } }
  @keyframes vf-b { 0%,100%{ translate: 0 0; } 50%{ translate: -9px -6px; } }
  @keyframes vf-c { 0%,100%{ translate: 0 0; } 33%{ translate: 6px 8px; } 66%{ translate: -6px -5px; } }
  @keyframes vf-glide { 0%{ translate: 0 0; } 50%{ translate: 28px 11px; } 100%{ translate: 0 0; } }
  @keyframes vf-twinkle { 0%,100%{ opacity: var(--o,.4); } 50%{ opacity: calc(var(--o,.4) * .35); } }
  @keyframes vf-spin { from{ rotate: 0deg; } to{ rotate: 360deg; } }
  @keyframes vf-sway { 0%,100%{ rotate: -5deg; } 50%{ rotate: 5deg; } }
  @keyframes vf-bob  { 0%,100%{ translate: 0 0; } 50%{ translate: 0 -15px; } }
  @keyframes v-float { 0%,100%{ transform: translateY(0); } 50%{ transform: translateY(-8px); } }
  @keyframes rd-vf-a { 0%,100%{ translate: 0 0; } 50%{ translate: 8px -11px; } }
  @keyframes rd-vf-b { 0%,100%{ translate: 0 0; } 50%{ translate: -9px -6px; } }
  @keyframes rd-vf-c { 0%,100%{ translate: 0 0; } 33%{ translate: 6px 8px; } 66%{ translate: -6px -5px; } }
  @keyframes rd-vf-glide { 0%{ translate: 0 0; } 50%{ translate: 28px 11px; } 100%{ translate: 0 0; } }
  @keyframes rd-vf-bob { 0%,100%{ translate: 0 0; } 50%{ translate: 0 -13px; } }
  @keyframes rd-vf-sway { 0%,100%{ rotate: -5deg; } 50%{ rotate: 5deg; } }
  @keyframes rd-vf-twinkle { 0%,100%{ opacity: var(--o,.2); } 50%{ opacity: calc(var(--o,.2) * .4); } }

  @keyframes v-stagger-in { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  .v-stagger > * { animation: v-stagger-in .44s cubic-bezier(.28,1.1,.64,1) both; }
  .v-stagger > *:nth-child(1){animation-delay:.16s} .v-stagger > *:nth-child(2){animation-delay:.20s}
  .v-stagger > *:nth-child(3){animation-delay:.24s} .v-stagger > *:nth-child(4){animation-delay:.28s}
  .v-stagger > *:nth-child(5){animation-delay:.32s} .v-stagger > *:nth-child(6){animation-delay:.36s}
  .v-stagger > *:nth-child(7){animation-delay:.40s} .v-stagger > *:nth-child(8){animation-delay:.44s}
  .v-stagger > *:nth-child(9){animation-delay:.48s} .v-stagger > *:nth-child(n+10){animation-delay:.52s}
  @keyframes v-pop { 0%{ transform: scale(.4); } 60%{ transform: scale(1.22); } 100%{ transform: scale(1); } }
  .v-pop { animation: v-pop .34s cubic-bezier(.34,1.56,.64,1) both; }
  @keyframes v-bounce { 0%,80%,100%{ transform: scale(.5); opacity: .45; } 40%{ transform: scale(1); opacity: 1; } }
  .v-bounce-dot { animation: v-bounce 1.1s ease-in-out infinite; }

  
  @keyframes rd-scrim-in { from { opacity: 0; } to { opacity: 1; } }
  @keyframes rd-drawer-in { from { transform: translateX(-100%); } to { transform: translateX(0); } }
  .rd-scrim { animation: rd-scrim-in .2s ease both; }
  .rd-drawer { animation: rd-drawer-in .26s cubic-bezier(.22,.61,.36,1) both; }
  @keyframes rd-sheet-in { from { transform: translateY(16px) scale(.985); opacity: 0; } to { transform: none; opacity: 1; } }
  .rd-sheet { animation: rd-sheet-in .24s cubic-bezier(.22,.61,.36,1) both; }
  @keyframes rd-toast-in { from { transform: translateY(12px); opacity: 0; } to { transform: none; opacity: 1; } }
  .rd-toast { animation: rd-toast-in .22s ease both; }
  @keyframes rd-spin { to { transform: rotate(360deg); } }
  .rd-spin { animation: rd-spin 1.1s linear infinite; }

  
  .fp-btn:focus-visible, .fp-row:focus-visible, .v-row:focus-visible, .v-key:focus-visible, .v-btn:focus-visible,
  .device-screen button:not(.ds-segmented__item):focus-visible, .device-screen a:focus-visible {
    
    outline: 2px solid var(--sd-colour-action-primary) !important; outline-offset: 2px !important; border-radius: var(--sd-radius-m);
  }
  
  .rd-on-teal button:focus-visible, .v3-hero button:focus-visible { outline-color: #fff !important; }

  @media (prefers-reduced-motion: reduce) {
    .vf, .v-planet, .v-shake, .v-skeleton, .v-rise, .v-splash-logo, .v-stagger > *, .v-pop, .v-bounce-dot,
    .v4-layer.is-in, .v4-layer.is-in.v4-sheetup, .v4-layer.is-out.v4-formout,
    .ipad-layer.is-in.ipad-sheetup, .ipad-layer.is-out.ipad-formout,
    .rd-scrim, .rd-drawer, .rd-sheet, .rd-toast, .screen-rise, .rd-vf { animation: none !important; }
    .v-splash, .fp-splash, .v4-mark { transition: none !important; }
    .rd-spin { animation-duration: 3s; }
  }
</style>
</head>
<body>

  <div id="app"></div>

    <script>
(function () {
  var rs = history.replaceState.bind(history);
  history.replaceState = function () {
    try {
      return rs.apply(null, arguments);
    } catch (e) {}
  };
  if (!navigator.clipboard) {
    navigator.clipboard = {
      writeText: function (t) {
        try {
          var a = document.createElement('textarea');
          a.value = t;
          a.style.position = 'fixed';
          a.style.opacity = '0';
          document.body.appendChild(a);
          a.select();
          document.execCommand('copy');
          a.remove();
          return Promise.resolve();
        } catch (e) {
          return Promise.reject(e);
        }
      }
    };
  }
})();
</script>
  <script>
(function () {
  setTimeout(function () {
    var boot = document.getElementById('boot');
    if (!boot || boot.classList.contains('is-gone') || window.PlaygroundApp) return;
    var missing = [];
    if (!window.React) missing.push('React');
    if (!window.PgSignin) missing.push('sign-in');
    if (!window.PgDash) missing.push('dashboard');
    if (!window.PlaygroundApp) missing.push('app');
    boot.setAttribute('style', 'position:fixed;inset:0;z-index:99;display:flex;align-items:center;' + 'justify-content:center;background:#0b3b46;color:#fff;padding:24px;' + 'font-family:-apple-system,Segoe UI,Roboto,sans-serif;');
    boot.innerHTML = '<div style="max-width:30em;line-height:1.5">' + '<div style="font-size:20px;font-weight:700;margin-bottom:12px">This didn\u2019t finish loading</div>' + '<p style="margin:0 0 12px">Nearly always this means it was opened from <b>inside</b> the zip. ' + 'Windows copies out just this one page and leaves the rest behind.</p>' + '<ol style="margin:0 0 12px;padding-left:1.2em">' + '<li>Save the .zip somewhere real \u2014 your Desktop is fine.</li>' + '<li>Right-click it and choose <b>Extract All</b>.</li>' + '<li>Open the folder that appears, then double-click <b>index.html</b>.</li>' + '</ol>' + '<p style="margin:0;opacity:.7;font-size:13px">If you already did that and still see this, ' + 'send Sam Weinhandl a screenshot of this screen. (Missing: ' + missing.join(', ') + ')</p>' + '</div>';
  }, 3000);
})();
</script>

  <script src="sd-icons.js"></script>
  <script src="shared.js"></script>
    <script src="signin.js"></script>
  <script src="dashboard.js"></script>
  <script src="session.js"></script>
  <script src="boot.js"></script>
</body>
